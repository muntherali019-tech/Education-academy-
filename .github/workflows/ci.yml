name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0 — it bundles
        # undici 8, which calls worker_threads.markAsUncloneable (Node 22.10+).
        # Node 20 cannot run the test suite, so 22 is the floor here.
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Enforces the coverage floors in vite.config.ts, so a regression fails CI.
      - run: npm run test:coverage

      - run: npx vite build

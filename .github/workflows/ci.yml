name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26.0.0 — it bundles
        # undici 8, which calls worker_threads.markAsUncloneable (Node 22.10+).
        # Node 20 cannot run the test suite, so 22 is the floor here.
        node-version: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npx vite build

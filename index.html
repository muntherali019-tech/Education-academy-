<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFF8F0" />
    <title>Education Academy — learn with Mochi</title>
    <meta
      name="description"
      content="Education Academy is a cat-themed learning game for UK learners: 15-question rounds across Key Stages 1-3 and Higher Education, with AI homework marking and a scan-and-solve helper."
    />
    <meta name="robots" content="index, follow" />

    <!-- Social cards. og:image is a real 1200x630 raster — a card with no image
         is just a grey link in every feed and chat app.
         NOTE: og:url and <link rel="canonical"> are deliberately absent until a
         production domain is settled — they must be absolute, and pointing them
         at the wrong host is worse than omitting them. Make og:image absolute at
         the same time; relative image URLs are resolved inconsistently. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Education Academy" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:title" content="Education Academy — learn with Mochi" />
    <meta property="og:description" content="15-question rounds across Key Stages 1-3 and Higher Education, with AI homework marking and a scan-and-solve helper." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Education Academy — learn with Mochi the cat" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Education Academy — learn with Mochi" />
    <meta name="twitter:description" content="15-question rounds across Key Stages 1-3 and Higher Education, with AI homework marking and a scan-and-solve helper." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Education Academy — learn with Mochi the cat" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
